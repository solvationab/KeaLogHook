{
  "Dhcp6": {
    "hooks-libraries": [
      {
        "library": "/usr/lib/kea/hooks/libdhcp6_ip_audit.so",
        "parameters": {
          "queue-size": 10000,
          "sinks": [
            {
              "type": "file",
              "name": "audit-file",
              "events": ["lease-assign", "lease-renew", "lease-release"],
              "path": "/var/log/kea/ip-audit6.log",
              "file-mode": "0640",
              "max-size": 104857600,
              "max-files": 10,
              "format": "json"
            }
          ]
        }
      }
    ]
  }
}