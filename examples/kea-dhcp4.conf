{
  "Dhcp4": {
    "hooks-libraries": [
      {
        "library": "/usr/lib/kea/hooks/libdhcp_ip_audit.so",
        "parameters": {
          "queue-size": 10000,
          // Omitting "events" records all supported events, including lease-delete.
          "sinks": [
            {
              "type": "file",
              "name": "audit-file",
              "path": "/var/log/kea/ip-audit.log",
              "file-mode": "0640",
              "max-size": 104857600,
              "max-files": 10,
              "fsync": false,
              "format": "json"
            },
            {
              "type": "zeromq",
              "name": "audit-zmq",
              "endpoint": "tcp://127.0.0.1:5556",
              "mode": "bind",
              // %{field} placeholders are allowed in the topic
              "topic": "ip-audit.%{event}",
              "multipart": true,
              "send-hwm": 10000,
              "linger-ms": 1000,
              "io-threads": 1,
              "format": "json"
            }
          ]
        }
      }
    ]
  }
}
