{
  "Dhcp4": {
    "hooks-libraries": [
      {
        "library": "/usr/lib/kea/hooks/libdhcp_ip_audit.so",
        "parameters": {
          // Every sink receives the events listed in "events" (default: all of
          // lease-assign, lease-renew, lease-release, lease-decline, lease-expire).
          "sinks": [
            {
              "type": "file",
              "name": "audit-file",
              "events": ["lease-assign", "lease-renew", "lease-release"],
              "path": "/var/log/kea/ip-audit.log",
              "file-mode": "0640",
              "max-size": 104857600,
              "max-files": 10,
              "fsync": false,
              "format": {
                "type": "json",
                // omit "fields" to log everything; empty values are skipped
                "fields": ["timestamp", "event", "ip-address", "hw-address",
                           "circuit-id", "remote-id", "giaddr", "subnet-id"],
                "include-empty": false
              }
            },
            {
              "type": "zeromq",
              "name": "audit-zmq",
              "endpoint": "tcp://127.0.0.1:5556",
              "mode": "bind",
              // %{field} placeholders are allowed in the topic
              "topic": "ip-audit.%{event}",
              "multipart": true,
              "send-hwm": 10000,
              "linger-ms": 1000,
              "io-threads": 1,
              "format": "json"
            },
            {
              "type": "file",
              "name": "audit-text",
              "path": "/var/log/kea/ip-audit.txt",
              "format": {
                "type": "template",
                "template": "%{timestamp} %{event} ip=%{ip-address} mac=%{hw-address} circuit=%{circuit-id} remote=%{remote-id} relay=%{giaddr}"
              }
            }
          ]
        }
      }
    ]
  }
}
